apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-deployment
  namespace: flash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flash
  template:
    metadata:
      labels:
        app: flash
    spec:
      containers:
      - name: my-app-container
        image: us-east4-docker.pkg.dev/a38-int-aa-main-0/applications/flash-app:latest
        ports:
        - containerPort: 8080