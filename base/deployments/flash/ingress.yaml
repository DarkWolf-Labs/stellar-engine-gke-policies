apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flash-ingress
  namespace: flash1
  annotations:
    kubernetes.io/ingress.class: "gce"
    ingress.gke.io/v1beta1.ManagedIngress: "true"
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: flash-service
            port:
              number: 80