apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: flash-gateway
  namespace: flash5
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - name: flash-tls-secret
        kind: secret
