apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flash-ingress
  namespace: flash5
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/v1beta1.FrontendConfig: "flash-frontend-config"
    networking.gke.io/managed-certificates: "flash-app-certificate"
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: flash-service
            port:
              number: 80