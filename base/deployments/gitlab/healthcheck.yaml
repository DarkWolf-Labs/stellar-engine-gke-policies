apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitlab-healthcheck
  namespace: gl-health
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: healthcheck-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
          - name: healthcheck-runner
            image: curlimages/curl:8.2.1
            args:
            - /bin/sh
            - |
              echo "Performing GitLab liveness check at $(date -Iseconds)..."
              
              # Use a variable for the target URL for easier management
              TARGET_URL="https://httphin.org/status/200"
              
              # Run the curl command and capture the HTTP status code.
              # The -s flag makes the output silent.
              # The -w flag writes the status code to stdout.
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL")

              # Check the status code and log the result to stdout.
              # This can then be captured by the cron job's logs in GKE.
              if [ "$STATUS_CODE" -eq 200 ]; then
                echo "Liveness check SUCCESS. Status code: $STATUS_CODE"
              else
                echo "Liveness check FAILED. Status code: $STATUS_CODE" 1>&2
              fi
            resources:
              requests:
                memory: "32Mi"
                cpu: "25m"
              limits:
                memory: "64Mi"
                cpu: "50m"
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
