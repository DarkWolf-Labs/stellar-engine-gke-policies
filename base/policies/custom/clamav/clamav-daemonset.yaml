# policies/clamav/clamav-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: clamav
  namespace: clamav
  annotations:
    network-controls/date: "2025-05-16"
  labels:
    app: clamav
    environment: security-tool
    team: security-ops
    pci-dss-firewall-audit: "2025q2"
spec:
  selector:
    matchLabels:
      app: clamav 
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: clamav
        environment: security-tool
        team: security-ops
        pci-dss-firewall-audit: "2025q2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 102
        fsGroup: 102  
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      serviceAccountName: default
      containers:
      - name: freshclam
        image: clamav/clamav:1.3.0
        securityContext:
          runAsUser: 101
          runAsGroup: 102
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e;
            echo "INFO: Ensuring directories...";
            mkdir -p /var/lib/clamav /var/log/clamav /run/clamav;
            FRESHCLAM_CONF="/etc/clamav/freshclam.conf";
            echo "INFO: Content of $FRESHCLAM_CONF (checking if readable):";
            cat $FRESHCLAM_CONF || echo "WARN: Could not cat $FRESHCLAM_CONF"; # Debug line
            # Check if main or daily definitions are missing or empty
            if [ ! -s "/var/lib/clamav/main.cvd" ] || [ ! -s "/var/lib/clamav/daily.cvd" ]
            then
              echo "INFO (freshclam): Main or daily definitions not found/empty, performing initial download..."
              freshclam --config-file="$FRESHCLAM_CONF" --verbose --stdout --datadir=/var/lib/clamav
              echo "INFO (freshclam): Initial download complete."
            else
              echo "INFO (freshclam): Definitions found in /var/lib/clamav."
            fi
            echo "INFO (freshclam): Starting freshclam daemon in the foreground..."
            exec freshclam --config-file="$FRESHCLAM_CONF" -d --foreground --verbose --datadir=/var/lib/clamav
        volumeMounts:
        - name: clamav-defs
          mountPath: /var/lib/clamav
        - name: clamav-logs
          mountPath: /var/log/clamav
        - name: clamav-run
          mountPath: /run/clamav
        - name: clamav-config-volume
          mountPath: /etc/clamav/freshclam.conf
          subPath: freshclam.conf
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      - name: clamd
        image: clamav/clamav:1.3.0
        securityContext:
          runAsUser: 101
          runAsGroup: 102
          runAsNonRoot: true
          # IMPORTANT: To scan the host filesystem, clamd usually needs elevated privileges.
          privileged: true
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            CLAMD_CONF="/etc/clamav/clamd.conf"
            echo "INFO (clamd): Waiting for initial virus definitions..."
            echo "INFO (clamd): Content of $CLAMD_CONF (checking if readable):"
            cat "$CLAMD_CONF" || echo "WARN (clamd): Could not cat $CLAMD_CONF"
            while true
            do
              if [ -s "/var/lib/clamav/main.cvd" ] && [ -s "/var/lib/clamav/daily.cvd" ]
              then
                echo "INFO (clamd): Main and daily definitions found and not empty."
                break # Exit the loop
              fi
              echo "INFO (clamd): Still waiting for main.cvd AND daily.cvd to be populated by freshclam..."
              sleep 10
            done
            echo "INFO (clamd): Definitions found. Starting clamd..."
            exec clamd --config-file="$CLAMD_CONF" --foreground
        ports:
        - name: clamd-sock
          containerPort: 3310 # Default clamd port
        volumeMounts:
        - name: clamav-defs
          mountPath: /var/lib/clamav
          readOnly: false 
        - name: clamav-logs
          mountPath: /var/log/clamav
        - name: clamav-run
          mountPath: /run/clamav
        - name: host-filesystem
          mountPath: /hostfs # Mount the entire host filesystem read-only
          readOnly: true
        - name: clamav-config-volume
          mountPath: /etc/clamav/clamd.conf
          subPath: clamd.conf
        - name: clamd-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "200m"
            memory: "1Gi" # clamd can be memory intensive during scans
          limits:
            cpu: "1"
            memory: "1Gi"
      volumes:
      - name: clamav-defs
        emptyDir: {}
      - name: clamav-logs
        emptyDir: {}
      - name: clamav-run
        emptyDir: {}
      - name: host-filesystem
        hostPath:
          path: / # Mounts the entire host filesystem
          type: Directory
      - name: clamav-config-volume
        configMap:
          name: clamav-config
          optional: false
          defaultMode: 0444
      - name: clamd-tmp
        emptyDir: {}
