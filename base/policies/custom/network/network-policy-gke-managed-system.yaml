apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gke-managed-system-restrict
  namespace: gke-managed-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []
    ports: []
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 6443
    - protocol: TCP
      port: 2379
    - protocol: TCP
      port: 3379
    - protocol: TCP
      port: 2380
    - protocol: TCP
      port: 10250
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 169.254.169.254/32 # GCE Metadata Server
  - to:
    - ipBlock:
        cidr: 35.190.244.0/20 # Broader range to include exceptions
        except:
        - 35.190.247.0/32
        - 35.190.250.0/31
        - 35.190.252.0/30
  - to:
    - ipBlock:
        cidr: 35.201.152.0/20 # Broader range to include exceptions
        except:
        - 35.201.153.0/32
        - 35.201.156.0/31
        - 35.201.158.0/30