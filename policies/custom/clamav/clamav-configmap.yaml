# policies/clamav/clamav-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-config
  namespace: clamav
data:
  clamd.conf: |
    # Basic clamd configuration (leave as is for now)
    LogFile /var/log/clamav/clamd.log
    LogTime yes
    PidFile /run/clamav/clamd.pid
    LocalSocket /run/clamav/clamd.sock
    FixStaleSocket yes
    User clamav
    ScanOnAccess false
    DetectPUA yes
    ScanPUP yes
    MaxScanSize 200M
    MaxFileSize 100M
    MaxRecursion 16
    MaxFiles 10000
    StreamMaxLength 150M

  freshclam.conf: |
    # Basic freshclam.conf
    DatabaseDirectory /var/lib/clamav
    UpdateLogFile /var/log/clamav/freshclam.log
    DatabaseOwner clamav
    DatabaseMirror database.clamav.net