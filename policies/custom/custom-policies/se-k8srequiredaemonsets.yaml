apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  annotations:
    description: Requires the list of daemonsets specified to be present.
    metadata.gatekeeper.sh/requires-sync-data: |
      "[
        [
          {
            "groups": ["extensions"],
            "versions": ["v1beta1"],
            "kinds": ["DaemonSet"]
          },
          {
            "groups": ["apps"],
            "versions": ["v1beta2", "v1"],
            "kinds": ["DaemonSet"]
          }
        ]
      ]"
    metadata.gatekeeper.sh/title: Required Daemonsets
    metadata.gatekeeper.sh/version: 1.1.2
  labels:
    policycontroller.configmanagement.gke.io/referential: "true"
  name: sek8srequiredaemonsets
spec:
  crd:
    spec:
      names:
        kind: SEK8sRequireDaemonsets
      validation:
        legacySchema: false
        openAPIV3Schema:
          properties:
            requiredDaemonsets:
              description: A list of names and namespaces of the required daemonsets.
              items:
                properties:
                  name:
                    description: The name of the required daemonset.
                    type: string
                  namespace:
                    description: The namespace for the required daemonset.
                    type: string
                type: object
              type: array
            restrictNodeSelector:
              default: false
              description: The daemonsets cannot include `NodeSelector`.
              type: boolean
          type: object
  targets:
  - rego: |
      package sek8srequiredaemonsets

      # Violation if DaemonSet's namespace doesn't exist
      violation[{"msg": msg}] {
          input.review.kind.kind == "Namespace"
          input.review.object.metadata.name == "default" # Optimization: run this global check once per audit

          required := input.parameters.requiredDaemonsets[_]
          not _namespace_exists(required.namespace)
          msg := sprintf("Namespace <%v> (for required daemonset <%v>) does not exist", [required.namespace, required.name])
      }

      # Violation if DaemonSet not found or fails nodeSelector check
      violation[{"msg": msg}] {
          input.review.kind.kind == "Namespace"
          current_ns_being_reviewed := input.review.object.metadata.name

          required := input.parameters.requiredDaemonsets[_]
          current_ns_being_reviewed == required.namespace # Focus on the relevant namespace

          _namespace_exists(required.namespace) # Only proceed if namespace exists

          not _daemonset_is_compliant(required, input.parameters)
          msg := sprintf("Namespace <%v> does not have a compliant required daemonset: <%v>", [required.namespace, required.name])
      }

      # Helper: Check if namespace exists
      _namespace_exists(ns_name) {
        data.inventory.cluster["v1"]["Namespace"][ns_name]
      }

      # Helper: Check if the daemonset exists and is compliant
      _daemonset_is_compliant(required_ds_info, params) {
        ds := data.inventory.cluster["apps/v1"]["DaemonSet"][required_ds_info.namespace][required_ds_info.name]
        count(ds) > 0
        _node_selector_check_passes(ds, params)
        and ds.status.numberReady == ds.status.desiredNumberScheduled # Strict check: all desired pods are ready
      }

      # Helper for nodeSelector check when restrict_ns is true
      _node_selector_check_passes(ds, params) {
        restrict_ns := object.get(params, "restrictNodeSelector", false)
        restrict_ns == true
        not _ds_has_nodeselector(ds) # If restriction is on, daemonset must NOT have a nodeSelector
      }

      # Helper for nodeSelector check when restrict_ns is false (this rule provides the "else true" logic)
      _node_selector_check_passes(ds, params) {
        restrict_ns := object.get(params, "restrictNodeSelector", false)
        restrict_ns == false # If restriction is off, this check passes
      }

      # Helper: Check if a DaemonSet spec has a nodeSelector defined
      _ds_has_nodeselector(ds) {
        count(object.get(ds.spec.template.spec, "nodeSelector", {})) > 0
      }
    target: admission.k8s.gatekeeper.sh
