apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  annotations:
    description: Requires that every namespace defined in the cluster has a default
      deny NetworkPolicy for egress.
    metadata.gatekeeper.sh/requires-sync-data: |
      "[
        [
          {
            "groups": ["extensions"],
            "versions": ["v1beta1"],
            "kinds": ["NetworkPolicy"]
          },
          {
            "groups": ["networking.k8s.io"],
            "versions": ["v1"],
            "kinds": ["NetworkPolicy"]
          },
          {
            "groups": [""],
            "versions": ["v1"],
            "kinds": ["Namespace"]
          }
        ]
      ]"
    metadata.gatekeeper.sh/title: Require Default Deny Egress Policy
    metadata.gatekeeper.sh/version: 1.0.3
  labels:
    policycontroller.configmanagement.gke.io/referential: "true"
  name: sek8srequiredefaultdenyegresspolicy
spec:
  crd:
    spec:
      names:
        kind: SEK8sRequireDefaultDenyEgressPolicy
      validation:
        legacySchema: false
  targets:
  - rego: |
      package sek8srequiredefaultdenyegresspolicy

      violation[{"msg": msg}] {
        input.review.kind.kind == "Namespace"
        not found_default_deny_egress_networkpolicy(input.review.object.metadata.name)
        msg := sprintf("Namespace <%v> does not have a default deny NetworkPolicy for egress", [input.review.object.metadata.name])
      }

      found_default_deny_egress_networkpolicy(ns) {
        np := data.inventory.cluster["networking.k8s.io/v1"]["NetworkPolicy"][ns][_]
        # Ensure podSelector is empty (selects all pods)
        count(object.get(np.spec, "podSelector", {})) == 0
      
        # Ensure policyTypes explicitly includes "Egress"
        p_types := object.get(np.spec, "policyTypes", [])
        p_types[_] == "Egress"
      
        # Ensure egress rules effectively deny all
        not_exists_or_is_empty_egress_rules(np)
      }
      
      not_exists_or_is_empty_egress_rules(val) {
        not val.spec.egress
      }
      not_exists_or_is_empty_egress_rules(val) {
        count(val.spec.egress) == 0
      }
    target: admission.k8s.gatekeeper.sh
